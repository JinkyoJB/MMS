# config/calibration_poses.yaml
#
# Hand-Eye 캘리브레이션용 로봇 포즈 목록.
# PhoXi Control에서 마커보드가 잘 보이는 자세를 직접 확인 후 기입하세요.
#
# 포즈 포맷 (두 가지 혼용 가능)
# ─────────────────────────────────────────────────────────────────
# [형식 A] joint 각도:
#   joints: [j1, j2, j3, j4, j5, j6, j7]   단위: degrees, xArm7 7축
#
# [형식 B] EE 6D 포즈 (IK로 자동 변환):
#   ee_pose: [x, y, z, roll, pitch, yaw]    단위: mm (위치), degrees (자세)
#   xArm TCP 기준, Base 프레임 기준 표현
# ─────────────────────────────────────────────────────────────────
#
# 권장 사항
# ----------
# - 마커보드 전체가 센서 시야 안에 들어오는 자세만 등록
# - 연속 포즈 간 EE 방향 변화가 클수록 (회전 다양성↑) 정확도 향상
#   → Joint 1만 변경(좌우 pan)은 퇴화 조건 — 기울기(tilt) 변화 필수
# - 최소 8개, 권장 12개 이상

poses:
  # ── 기존 포즈 (joints 형식) ────────────────────────────────────
  - name: "pose_0"
    joints: [5.2, 39.4, 0.4, 60.3, 5.6, -60.6, -0.6]

  - name: "pose_1"
    joints: [-6.2, 37.4, 0.9, 60.8, 2.4, -54.6, -12.5]

  - name: "pose_2"
    joints: [-12.9, 43.1, -7.1, 58.6, -10.8, -61.4, -21.8]

  - name: "pose_3"
    joints: [14.4, 36.6, 5.5, 53.8, 16.1, -59.7, 7.5]

  - name: "pose_4"
    joints: [23.2, 39.3, 6.2, 60.3, 24.9, -57.5, 7.3]

